return `<div class="dh"><h3>Your bag (${cart.reduce((a,i)=>a+i.q,0)})</h3><button data-a="close" aria-label="Close">✕</button></div><div class="db">${cart.length?`<div class="fb"><i style="width:${pc}%"></i></div><small>${sub>=CONFIG.shipping.freeAt?'You have unlocked free shipping.':'Add '+fmt(CONFIG.shipping.freeAt-sub)+' more for free shipping.'}</small>`+cart.map((i,k)=>{const p=find(i.id);return `<div class="ln"><img alt="${esc(p.n)}" src="${photo(p)}" onerror="this.onerror=null;this.src='naksha-assets/fallback.webp'"><div><b style="font-weight:500">${p.n}</b><div style="color:var(--mut)">${p.colors[i.c][0]} · ${i.s}</div><div style="margin-top:6px">${fmt(p.price*i.q)}</div><div style="margin-top:8px;display:flex;align-items:center"><div class="qt"><button data-a="cq" data-k="${k}" data-d="-1" aria-label="Decrease">−</button><span>${i.q}</span><button data-a="cq" data-k="${k}" data-d="1" aria-label="Increase">+</button></div><u data-a="rmv" data-k="${k}" role="button" tabindex="0">Remove</u></div></div></div>`}).join(''):`<div class="empty"><p>Your bag is empty.</p><a class="btn" href="#shop" data-a="close">Start shopping</a></div>`}</div>${cart.length?`<div class="df"><p style="display:flex;justify-content:space-between;margin:0 0 14px"><span>Subtotal</span><b style="font-weight:500">${fmt(sub)}</b></p><a class="btn" style="display:block;text-align:center" href="#checkout" data-a="close">Proceed to checkout</a><p style="text-align:center;margin:12px 0 0"><button data-a="close" style="text-decoration:underline">Continue shopping</button></p></div>`:''}`}
function syncLock(){document.body.classList.toggle('lock',$('#dr').classList.contains('o')||$('#md').classList.contains('o')||$('#mm').classList.contains('o'))}function drawer(open){const d=$('#dr'),was=d.classList.contains('o');d.innerHTML=cartHTML();if(open!==undefined){if(open&&!was)returnFocus=document.activeElement;d.classList.toggle('o',open);d.inert=!open;d.setAttribute('aria-hidden',String(!open));d.setAttribute('aria-modal',String(open));$('#ov').classList.toggle('o',open||$('#md').classList.contains('o'));syncLock();if(open){d.focus();d.querySelector('[data-a=close]')?.focus()}else if(was&&returnFocus?.focus){returnFocus.focus();returnFocus=null}}}
function save(){sv('mc',cart);sv('mw',wish);const n=cart.reduce((a,i)=>a+i.q,0);$('#cb').textContent=n||'';$('#wb').textContent=wish.length||'';drawer()}
function addC(id,c,s,q){const p=find(id);if(!p||!p.colors[c]||!SZ.includes(s)||!Number.isInteger(q)||q<1){toast('Choose a valid product option');return false}const k=cart.find(i=>i.id==id&&i.c==c&&i.s==s),next=(k?.q||0)+q;if(next>stock(p,s)){toast(`Only ${stock(p,s)} available in size ${s}`);return false}k?k.q=next:cart.push({id,c,s,q});save();return true}
function checkout(){if(!cart.length)return `<div class="w empty"><h2>Your bag is empty</h2><p><a class="btn" href="#shop">Continue shopping</a></p></div>`;const sub=cart.reduce((a,i)=>a+find(i.id).price*i.q,0),sh=sub>=CONFIG.shipping.freeAt?0:CONFIG.shipping.standard;
return `<div class="w"><form class="co" id="cf"><div><h2 style="margin-bottom:24px">Checkout</h2><div class="two"><input required placeholder="First name" autocomplete="given-name"><input required placeholder="Last name" autocomplete="family-name"></div><input type="email" required placeholder="Email" autocomplete="email"><input type="tel" required pattern="[6-9][0-9]{9}" placeholder="Mobile number (10 digits)" autocomplete="tel"><input required placeholder="Address" autocomplete="street-address"><div class="two"><input required placeholder="City"><input required placeholder="State"></div><input required pattern="[0-9]{6}" inputmode="numeric" placeholder="PIN code (6 digits)"><h3 style="margin:18px 0 12px">Payment</h3><div class="pm"><label><input type="radio" name="pm" checked> UPI: GPay, PhonePe, Paytm</label><label><input type="radio" name="pm"> Debit / credit card (RuPay, Visa)</label><label><input type="radio" name="pm"> Cash on delivery</label></div><p style="font-size:13px;color:var(--mut)">Demo checkout only. No payment is processed and no order is sent, stored or fulfilled.</p></div><div class="sm"><h3 style="margin-bottom:12px">Order summary</h3>${cart.map(i=>{const p=find(i.id);return `<p><span>${p.n} (${p.colors[i.c][0]}, ${i.s}) × ${i.q}</span><span>${fmt(p.price*i.q)}</span></p>`}).join('')}<hr style="border:0;border-top:1px solid var(--ln)"><p><span>Shipping</span><span>${sh?fmt(sh):'Free'}</span></p><p style="font-size:13px;color:var(--mut)"><span>Tax treatment is placeholder content and must be confirmed for a live store.</span></p><p><b style="font-weight:500">Total</b><b style="font-weight:500">${fmt(sub+sh)}</b></p><button class="btn" style="width:100%;margin-top:14px">Place order</button></div></form></div>`}
function about(){return story()+`<section><div class="w" style="max-width:760px"><h2>Shipping, returns &amp; care</h2><p>Free shipping on orders of ${fmt(CONFIG.shipping.freeAt)} or more; standard demo shipping below the threshold is ${fmt(CONFIG.shipping.standard)}. ${CONFIG.returns.days}-day returns on ${esc(CONFIG.returns.condition)} under an illustrative demo policy.</p><p>Questions: ${esc(CONFIG.contact.email)} (placeholder demo address).</p></div></section>`+foot()}
let obs;let returnFocus=null;function route(){const h=location.hash.slice(1)||'home',a=$('#app');a.classList.remove('in');closeAll();
const nav={shop:'shop','shop-new':'shop-new','shop-women':'shop-women','shop-men':'shop-men'};
if(/^shop|^col-/.test(h)){F={cat:[],size:[],color:[],max:15000,q:F.q&&h=='shop'?F.q:'',sort:'new',g:'',col:'',nw:false,tag:'Shop'};if(h=='shop-women'){F.g='Women';F.tag='Women'}if(h=='shop-men'){F.g='Men';F.tag='Men'}if(h=='shop-new'){F.nw=true;F.tag='New arrivals'}if(h.startsWith('col-')){F.col=h.slice(4);F.tag=CN[F.col]||'Collection'}a.innerHTML=shop();fgrid()}
else if(h.startsWith('p-')){const p=find(h.slice(2));a.innerHTML=p?pdp(p):`<div class="w empty"><h2>Product not found</h2><a class="btn" href="#shop">Back to shop</a></div>`}
else if(h=='wishlist')a.innerHTML=wishPage();else if(h=='checkout')a.innerHTML=checkout();else if(h=='done')a.innerHTML=`<div class="w"><div class="dn" style="padding:100px 0"><h2>Thank you.</h2><p>Your demo reference <b>NKS-${(Date.now()%900000+100000)}</b> has been generated. No real order was placed and no confirmation email was sent.</p><a class="btn" href="#home">Continue shopping</a></div></div>`;
else if(h=='about')a.innerHTML=about();else a.innerHTML=home();
$$('#ln a').forEach(x=>x.classList.toggle('on',x.getAttribute('href')=='#'+h));scrollTo(0,0);requestAnimationFrame(()=>a.classList.add('in'))}
$('#brand-logo').textContent=CONFIG.brand.name;document.title=CONFIG.brand.name+' — '+CONFIG.brand.tagline;$('#ln').innerHTML=[['Home','home'],['New Arrivals','shop-new'],['Women','shop-women'],['Men','shop-men'],['Collections','col-classics'],['About','about']].map(x=>`<a href="#${x[1]}">${x[0]}</a>`).join('');
$('#mm').innerHTML=$('#ln').innerHTML;
function closeAll(){$('#bg').classList.remove('o');$('#bg').setAttribute('aria-expanded','false');$('#mm').classList.remove('o');$('#mm').inert=true;$('#mm').setAttribute('aria-hidden','true');$('#sb').classList.remove('o');$('#sb').inert=true;$('#sb').setAttribute('aria-hidden','true');drawer(false);modal(false);syncLock()}
function modal(o,h){const m=$('#md'),was=m.classList.contains('o');if(h)m.innerHTML='<button data-a="close" aria-label="Close dialog" style="position:absolute;top:10px;right:14px;font-size:18px">✕</button>'+h;if(o&&!was)returnFocus=document.activeElement;m.classList.toggle('o',o);m.inert=!o;m.setAttribute('aria-hidden',String(!o));m.setAttribute('aria-modal',String(o));$('#ov').classList.toggle('o',o||$('#dr').classList.contains('o'));syncLock();if(o){m.focus();m.querySelector('[data-a=close]')?.focus()}else if(was&&returnFocus?.focus&&!$('#dr').classList.contains('o')){returnFocus.focus();returnFocus=null}}
const SG=`<h3>Size guide</h3><p class="demo-note">Illustrative general measurements in centimetres and approximate inches. Fit varies by garment; use the final product specification before buying.</p><table><tr><th>Size</th><th>Chest</th><th>Waist</th></tr>${[['XS',84,68],['S',90,74],['M',96,80],['L',102,86],['XL',108,92],['XXL',114,98]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]} cm (${Math.round(r[1]/2.54)} in)</td><td>${r[2]} cm (${Math.round(r[2]/2.54)} in)</td></tr>`).join('')}</table><p><button class="btn" data-a="close">Close</button></p>`;
addEventListener('hashchange',route);addEventListener('scroll',()=>$('#hd').classList.toggle('s',scrollY>40),{passive:true});
addEventListener('keydown',e=>{if(e.key==='Escape'){closeAll();return}if(e.key==='Enter'&&e.target.getAttribute('role')==='button')e.target.click();if(e.key==='Tab'){const layer=$('#md').classList.contains('o')?$('#md'):($('#dr').classList.contains('o')?$('#dr'):null);if(layer){const els=[...layer.querySelectorAll('a[href],button:not(:disabled),input:not(:disabled),select:not(:disabled),[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);if(els.length){const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}}});
$('#ov').onclick=()=>closeAll();$('#bg').setAttribute('aria-expanded','false');$('#bg').onclick=()=>{const o=!$('#mm').classList.contains('o');$('#bg').classList.toggle('o',o);$('#bg').setAttribute('aria-expanded',String(o));$('#mm').classList.toggle('o',o);$('#mm').inert=!o;$('#mm').setAttribute('aria-hidden',String(!o));syncLock();if(o)$('#mm').querySelector('a')?.focus();else $('#bg').focus()};$('#mm').onclick=e=>{if(e.target.tagName=='A')closeAll()};
$('#si').oninput=e=>{F.q=e.target.value;if(!/^#shop$/.test(location.hash)){location.hash='shop'}else fgrid()};
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id=='nf'){$('#ok').textContent='Thank you. You are on the list.';e.target.reset()}if(e.target.id=='cf'){const invalid=cart.find(i=>i.q>stock(find(i.id),i.s));if(invalid){toast('A cart quantity is no longer available');return}cart=[];save();location.hash='done'}if(e.target.id=='af'){const f=new FormData(e.target);sv('mu',{n:f.get('n'),e:f.get('e')});modal(true,acctHTML());toast('Signed in')}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f){const a=F[t.dataset.f];t.checked?a.push(t.value):a.splice(a.indexOf(t.value),1);fgrid()}if(t.id=='so'){F.sort=t.value;fgrid()}});
document.addEventListener('input',e=>{if(e.target.id=='pr'){F.max=+e.target.value;$('#pv').textContent=fmt(F.max);fgrid()}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=+t.dataset.id;
if(a=='close')closeAll();
else if(a=='srch'){const o=!$('#sb').classList.contains('o');$('#sb').classList.toggle('o',o);$('#sb').inert=!o;$('#sb').setAttribute('aria-hidden',String(!o));if(o)setTimeout(()=>$('#si').focus(),50)}
else if(a=='acct')modal(true,acctHTML());else if(a=='out'){try{localStorage.removeItem('mu')}catch(x){}modal(true,acctHTML());toast('Signed out')}
else if(a=='wls')location.hash='wishlist';
else if(a=='cart')drawer(true);
else if(a=='wish'){const i=wish.indexOf(id);i<0?wish.push(id):wish.splice(i,1);save();toast(i<0?'Saved to wishlist':'Removed from wishlist');$$(`[data-a=wish][data-id="${id}"]`).forEach(b=>{b.classList.toggle('on',i<0);b.setAttribute('aria-pressed',String(i<0));b.setAttribute('aria-label',`${i<0?'Remove from':'Add to'} wishlist: ${find(id)?.n||'product'}`);if(b.textContent.trim())b.textContent=i<0?'Saved':'Save'});if(location.hash=='#wishlist')$('#app').innerHTML=wishPage()}
else if(a=='quick')qv(id);else if(a=='qc'){qs.c=+t.dataset.i;qv(qs.id,1)}else if(a=='qz'){qs.s=t.dataset.s;qv(qs.id,1)}else if(a=='qadd'){if(!qs.s)return toast('Choose a size to continue');if(addC(qs.id,qs.c,qs.s,1)){modal(false);toast('Added to bag');drawer(true)}}
else if(a=='car')$('#car').scrollBy({left:+t.dataset.d*320,behavior:'smooth'});
else if(a=='clr'){F={...F,cat:[],size:[],color:[],max:15000,q:''};$('#si').value='';$$('.fl input[type=checkbox]').forEach(c=>c.checked=false);$('#pr').value=15000;$('#pv').textContent=fmt(15000);fgrid()}
else if(a=='rm'){const v=t.dataset.v;if(v=='__q'){F.q='';$('#si').value=''}else if(v=='__p'){F.max=15000;$('#pr').value=15000;$('#pv').textContent=fmt(15000)}else{['cat','size','color'].forEach(k=>{const i=F[k].indexOf(v);if(i>-1)F[k].splice(i,1)});$$('.fl input').forEach(c=>{if(c.value==v)c.checked=false})}fgrid()}
else if(a=='ftog')$('#fl').classList.toggle('o');
else if(a=='img'){sel.v=+t.dataset.v;$$('#th button').forEach(b=>{b.classList.toggle('on',b==t);b.setAttribute('aria-pressed',b==t)});$('#mi').src=photo(find(location.hash.slice(3)),sel.v===1)}
else if(a=='col'){sel.c=+t.dataset.i;const p=find(location.hash.slice(3));$$('#sw button').forEach((b,i)=>{b.classList.toggle('on',b==t);b.setAttribute('aria-pressed',b==t)});$('#cn').textContent=p.colors[sel.c][0]}
else if(a=='sz'){sel.s=t.dataset.s;const n=stock(find(location.hash.slice(3)),sel.s);sel.q=Math.min(sel.q,n);$('#qv').textContent=sel.q;$$('#sz button').forEach(b=>{b.classList.toggle('on',b==t);b.setAttribute('aria-pressed',b==t)});$('#sk').textContent=n<4?`Only ${n} left in ${sel.s}`:`In stock in ${sel.s}`}
else if(a=='pq'){const max=sel.s?stock(find(location.hash.slice(3)),sel.s):9;sel.q=Math.max(1,Math.min(Math.max(1,max),sel.q+Number(t.dataset.d)));$('#qv').textContent=sel.q}
else if(a=='add'){if(!sel.s){$('#sk').textContent='Please choose a size first';return toast('Choose a size to continue')}if(addC(id,sel.c,sel.s,sel.q)){toast('Added to bag');drawer(true)}}
else if(a=='size')modal(true,SG);
else if(a=='cq'){const k=+t.dataset.k,i=cart[k],p=find(i?.id);if(!i||!p)return;const next=i.q+Number(t.dataset.d);if(next<1)cart.splice(k,1);else if(next>stock(p,i.s)){toast(`Only ${stock(p,i.s)} available in size ${i.s}`);return}else i.q=next;save()}
else if(a=='rmv'){cart.splice(+t.dataset.k,1);save();toast('Removed from bag')}});
$('#app').innerHTML='<div class="ld">NAKSHA</div>';$('#app').classList.add('in');save();setTimeout(route,500);
</script></body></html>
